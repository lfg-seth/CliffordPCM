[env]
platform = platformio/raspberrypi@1.20.0
board = pico
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MCP2515@0.2.1
    adafruit/Adafruit CAN@0.2.3
    adafruit/Adafruit BusIO@1.17.4

[env:engine_bay_pcm]
build_src_filter = +<pcm/>
build_flags = -DPCM_ENGINE_BAY

[env:cargo_bay_pcm]
build_src_filter = +<pcm/>
build_flags = -DPCM_CARGO_BAY

[env:switch_panel]
build_src_filter = +<switch_panel/>
